[project]
name = "ocr-service"
version = "0.1.0"
description = "Lightweight FastAPI + Tesseract OCR home service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]
