services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtg-utils-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mtg_utils?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/mtg_utils?schema=public
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mtg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: mtg-utils-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:8000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mtg_utils?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/mtg_utils?schema=public
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - mtg-network

  db:
    image: postgres:16-alpine
    container_name: mtg-utils-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mtg_utils
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mtg_utils"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mtg-network

volumes:
  postgres_data:
    driver: local

networks:
  mtg-network:
    driver: bridge
